name: Bug report
description: Report a reproducible problem using synthetic data.
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: "Do not attach personal databases, recordings, manuals, credentials or identifiable logs. Use SECURITY.md for vulnerability reports."
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
      description: What should happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide fictional input and exact steps in a clean work folder.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows/Python version, Nova commit and model name; omit account names and device identifiers.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I reviewed this report for personal data and credentials.
          required: true
