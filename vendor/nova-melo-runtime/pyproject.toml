[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-melo-runtime"
version = "0.1.2.1"
description = "Nova local English and Spanish MeloTTS inference runtime"
license = {file = "LICENSE"}
requires-python = ">=3.13,<3.14"
dependencies = [
  "torch==2.14.1+cpu",
  "torchaudio==2.11.0+cpu",
  "cached-path==1.8.10",
  "transformers==5.21.0",
  "num2words==0.5.14",
  "unidic-lite==1.0.8",
  "pykakasi==2.3.0",
  "g2p-en==2.1.0",
  "gruut==2.4.0",
  "librosa==1.0.0",
  "pydub==0.25.1",
  "inflect==7.6.0",
  "pypinyin==0.55.0",
  "cn2an==0.5.24",
  "jieba==0.42.1",
  "tqdm==4.70.1",
  "numpy==2.5.4",
  "soundfile==0.14.0",
  "scipy==1.18.1",
  "huggingface-hub==1.33.0",
  "anyascii==0.3.3",
  "jamo==0.4.1",
  "gruut-lang-en==2.0.1",
  "gruut-lang-es==2.0.1",
  "gruut-lang-fr==2.0.2"
]

[tool.setuptools.packages.find]
include = ["melo*"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.rep", "*.json", "cmudict_*"]
